name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Plain git instead of a third-party checkout action (no unverified action pins).
      - name: Fetch source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= -c http.extraheader= fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Check Python (3.11+ from the runner image, no installs)
        shell: bash
        run: |
          PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" -c "import sys; print(sys.version); raise SystemExit(0 if sys.version_info >= (3, 11) else 'Python 3.11+ required')"
          "$PY" -c "import tkinter" && echo "tkinter available" || echo "tkinter unavailable: Tk-dependent tests will be skipped"
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: '"$PY" -m unittest discover -s tests -t . -v'

      # Ubuntu exercises the internal synthetic/core development backend only.
      # It is regression evidence, not a supported Linux product scan or an
      # offline-filesystem guarantee. Public GUI live tests stay Windows-only.
      - name: Development core regression (Ubuntu; not product support)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a "$PY" -m unittest discover -s tests -t . -v
          else
            "$PY" -m unittest discover -s tests -t . -v
          fi
