name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        # TEMPORARY DIAGNOSTIC / RELEASE HELD: restore Windows+Ubuntu before release.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Plain git instead of a third-party checkout action (no unverified action pins).
      - name: Fetch source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= -c http.extraheader= fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Check Python (3.11+ from the runner image, no installs)
        shell: bash
        run: |
          PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" -c "import sys; print(sys.version); raise SystemExit(0 if sys.version_info >= (3, 11) else 'Python 3.11+ required')"
          "$PY" -c "import tkinter" && echo "tkinter available" || echo "tkinter unavailable: Tk-dependent tests will be skipped"
          echo "PY=$PY" >> "$GITHUB_ENV"

      # TEMPORARY DIAGNOSTIC / RELEASE HELD: restore full unittest discovery
      # on Windows and Ubuntu before release.
      - name: Narrow hosted diagnostics (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          "$PY" -m unittest
          tests.test_core_fs.Permissions.test_unreadable_file_is_incomplete
          tests.test_gui_native_bounds.NativeClientBoundsTests.test_physical_screen_hits_at_supported_sizes
          -v
